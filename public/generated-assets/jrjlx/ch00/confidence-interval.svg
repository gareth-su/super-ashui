<text x="72" y="92" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#172033">置信区间：点估计周围的一段范围</text>
<text x="72" y="132" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#526070">点估计告诉你中心位置，标准误告诉你不确定性有多大。</text>
<rect x="90" y="172" width="300" height="120" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="112" y="210" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">点估计</text>
<text x="112" y="244" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">b2 = 0.1283</text>
<text x="112" y="272" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">一条样本给出的系数</text>
<rect x="450" y="172" width="300" height="120" rx="14" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
<text x="472" y="210" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">标准误</text>
<text x="472" y="244" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">se = 0.0305</text>
<text x="472" y="272" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">估计不确定性</text>
<rect x="810" y="172" width="300" height="120" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="832" y="210" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">95% 近似区间</text>
<text x="832" y="244" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">b2 ± 2se</text>
<text x="832" y="272" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">(0.0673, 0.1893)</text>

