<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" fill="#f8fafc"/>
<rect x="40" y="36" width="1120" height="608" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="72" y="92" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#172033">EViews 输出字段阅读顺序</text>
<text x="72" y="132" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#526070">先看因变量、样本量，再看系数、标准误、t 值和 p 值。</text>
<rect x="80" y="165" width="330" height="130" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="102" y="203" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">Dependent Variable</text>
<text x="102" y="237" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">被解释变量</text>
<text x="102" y="265" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">这次回归的 y</text>
<rect x="435" y="165" width="330" height="130" rx="14" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
<text x="457" y="203" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">Coefficient</text>
<text x="457" y="237" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">系数</text>
<text x="457" y="265" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">x 增加 1 时 y 平均变化多少</text>
<rect x="790" y="165" width="330" height="130" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="812" y="203" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">Prob.</text>
<text x="812" y="237" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">p 值</text>
<text x="812" y="265" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">判断是否拒绝 H0</text>
<rect x="80" y="355" width="330" height="130" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
<text x="102" y="393" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">Std. Error</text>
<text x="102" y="427" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">标准误</text>
<text x="102" y="455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">估计不确定性</text>
<rect x="435" y="355" width="330" height="130" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
<text x="457" y="393" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">t-Statistic</text>
<text x="457" y="427" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">t 值</text>
<text x="457" y="455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">系数离 0 有多远</text>
<rect x="790" y="355" width="330" height="130" rx="14" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
<text x="812" y="393" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">R-squared</text>
<text x="812" y="427" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">拟合优度</text>
<text x="812" y="455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">解释了多少 y 的波动</text>

<text x="72" y="620" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">教学示意图：根据第 0 讲讲义与 Stata 入门材料重绘，不是原始软件输出截图。</text>
</svg>