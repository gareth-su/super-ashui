<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" fill="#f8fafc"/>
<rect x="40" y="36" width="1120" height="608" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="72" y="92" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#172033">总体回归线 vs 样本回归线</text>
<text x="72" y="132" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#526070">总体关系是看不见的真关系，样本线是我们用样本估出来的近似。</text>
<rect x="90" y="172" width="470" height="136" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="112" y="210" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">总体回归线</text>
<text x="112" y="244" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">E(y</text>
<text x="112" y="272" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">x)=β1+β2x</text>
<text x="112" y="300" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">β 是未知真参数</text>
<rect x="640" y="172" width="470" height="136" rx="14" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
<text x="662" y="210" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">样本回归线</text>
<text x="662" y="244" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">ŷ=b1+b2x</text>
<text x="662" y="272" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">b 或 βhat 是估计结果</text>

        <line x1="150" y1="520" x2="1040" y2="260" stroke="#94a3b8" stroke-width="5" stroke-dasharray="14 10"/>
        <line x1="150" y1="545" x2="1040" y2="245" stroke="#2563eb" stroke-width="5"/>
        <text x="180" y="488" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">看不见的真线</text>
        <text x="760" y="232" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#2563eb">用样本估出的线</text>
        
<text x="72" y="620" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#64748b">教学示意图：根据第 0 讲讲义与 Stata 入门材料重绘，不是原始软件输出截图。</text>
</svg>