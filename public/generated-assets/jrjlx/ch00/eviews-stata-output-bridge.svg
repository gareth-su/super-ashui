<text x="112" y="216" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">EViews</text>
<text x="112" y="250" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">Coefficient</text>
<text x="112" y="278" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">Std. Error</text>
<text x="112" y="306" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">t-Statistic</text>
<text x="112" y="334" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">Prob.</text>
