<text x="672" y="216" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">Stata</text>
<text x="672" y="250" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">Coef.</text>
<text x="672" y="278" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">Std. Err.</text>
<text x="672" y="306" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">t</text>
<text x="672" y="334" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">P></text>
<text x="672" y="362" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">t</text>
<text x="672" y="390" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155"></text>

        <path d="M555 288 C590 260 615 260 650 288" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#b)"/>
