<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" fill="#f8fafc"/>
<rect x="40" y="36" width="1120" height="608" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="72" y="92" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#172033">简单回归：数据点、拟合线与残差</text>
<text x="72" y="132" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#526070">OLS 在所有可能的直线中，选择让残差平方和最小的那一条。</text>
<rect x="78" y="166" width="245" height="112" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="100" y="204" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">数据点</text>
<text x="100" y="238" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">每个点是一条观测</text>
<text x="100" y="266" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">例如一个家庭的收入与食品支出</text>
<rect x="396" y="166" width="245" height="112" rx="14" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
<text x="418" y="204" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">拟合线</text>
<text x="418" y="238" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">样本回归线</text>
<text x="418" y="266" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">代表平均关系的估计</text>
<rect x="714" y="166" width="245" height="112" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="736" y="204" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">残差</text>
<text x="736" y="238" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">点到线的垂直距离</text>
<text x="736" y="266" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">实际值 - 拟合值</text>

