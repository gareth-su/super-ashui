<text x="72" y="92" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#172033">t 检验：看估计值离 H0 有多远</text>
<text x="72" y="132" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#526070">t 值等于估计值与原假设之间的距离，再除以标准误。</text>
<rect x="96" y="170" width="320" height="130" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="118" y="208" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">H0</text>
<text x="118" y="242" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">原假设</text>
<text x="118" y="270" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">例如 β2=0</text>
<rect x="448" y="170" width="320" height="130" rx="14" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
<text x="470" y="208" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">t 值</text>
<text x="470" y="242" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">(估计值-假设值)/标准误</text>
<text x="470" y="270" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">距离的标准化</text>
<rect x="800" y="170" width="320" height="130" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="822" y="208" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">p 值</text>
<text x="822" y="242" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">若 H0 为真</text>
<text x="822" y="270" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">看到这么极端结果的概率</text>

