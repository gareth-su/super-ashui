<text x="72" y="92" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#172033">Stata 入门文件关系：dta、do、smcl</text>
<text x="72" y="132" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#526070">第 0 讲用 beauty 数据串起数据、脚本和日志。</text>
<rect x="90" y="190" width="260" height="130" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="112" y="228" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">.dta 数据</text>
<text x="112" y="262" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">beauty.dta</text>
<text x="112" y="290" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">Stata 能直接读取的数据表</text>
<rect x="470" y="190" width="260" height="130" rx="14" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
<text x="492" y="228" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">.do 脚本</text>
<text x="492" y="262" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">beauty.do</text>
<text x="492" y="290" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">按顺序写好的命令</text>
<rect x="850" y="190" width="260" height="130" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="872" y="228" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#172033">.smcl 日志</text>
<text x="872" y="262" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">beauty.smcl</text>
<text x="872" y="290" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#334155">Stata 输出记录</text>

