<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="偏度、峰度与重尾怎么读"><rect width="960" height="540" fill="#fff"/><text x="48" y="60" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#111827">偏度、峰度与重尾怎么读</text><line x1="90" y1="250" x2="380" y2="250" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="90" y1="250" x2="90" y2="110" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><path d="M105 250 C145 245 180 230 210 190 C235 155 275 155 300 190 C330 235 350 248 375 250" fill="none" stroke="#2563eb" stroke-width="4"/><text x="135" y="310" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#111827">近似对称</text><text x="120" y="338" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#4b5563">均值两侧形状接近</text><line x1="555" y1="250" x2="845" y2="250" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="555" y1="250" x2="555" y2="110" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><path d="M560 250 C620 245 660 235 700 205 C720 185 745 150 772 135 C798 155 815 220 840 250" fill="none" stroke="#dc2626" stroke-width="4"/><text x="605" y="310" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#111827">负偏态 / 左尾风险</text><text x="585" y="338" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#4b5563">极端负收益更值得警惕</text><line x1="90" y1="455" x2="845" y2="455" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/><text x="130" y="410" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#374151">峰度关注尾部厚度：正超额峰度表示极端值概率高于正态，不只是“方差大”。</text></svg>
