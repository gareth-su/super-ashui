<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="简单收益率与对数收益率的差异"><rect width="960" height="540" fill="#fff"/><text x="48" y="60" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#111827">简单收益率与对数收益率的差异</text><line x1="110" y1="420" x2="850" y2="420" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="420" x2="110" y2="115" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><text x="805" y="455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#111827">R</text><text x="70" y="130" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#111827">r</text><path d="M120 416 C300 350 520 250 830 120" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M120 416 C320 345 550 210 830 70" fill="none" stroke="#f97316" stroke-width="4" stroke-dasharray="10 8"/><text x="615" y="160" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#2563eb">小收益率：r 约等于 R</text><text x="600" y="95" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#ea580c">极端收益或长持有期：差异变大</text><text x="165" y="505" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#4b5563">教学示意：蓝线表示 ln(1+R)，橙线表示简单线性近似。不是历史数据。</text></svg>
