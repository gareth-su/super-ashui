<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="核密度估计与带宽 h"><rect width="960" height="540" fill="#fff"/><text x="48" y="60" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#111827">核密度估计与带宽 h</text><text x="105" y="120" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#111827">h 太小</text><text x="420" y="120" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#111827">合适 h</text><text x="730" y="120" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#111827">h 太大</text><line x1="80" y1="390" x2="300" y2="390" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="390" y1="390" x2="610" y2="390" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="700" y1="390" x2="920" y2="390" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><path d="M90 385 L110 300 L130 370 L150 230 L170 360 L190 250 L210 370 L230 310 L250 385" fill="none" stroke="#dc2626" stroke-width="4"/><path d="M400 385 C445 380 460 280 500 250 C540 280 555 380 600 385" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M710 385 C765 360 805 335 850 330 C885 335 905 360 915 385" fill="none" stroke="#6b7280" stroke-width="4"/><text x="86" y="430" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#4b5563">过度抖动</text><text x="410" y="430" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#4b5563">保留形状</text><text x="714" y="430" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#4b5563">过度平滑</text><text x="150" y="500" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#374151">核密度不是“真实答案”，带宽选择会改变图形，因此读图要说明 h 的影响。</text></svg>
