<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="ACF 图与波动性聚集"><rect width="960" height="540" fill="#fff"/><text x="48" y="60" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#111827">ACF 图与波动性聚集</text><text x="85" y="120" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#111827">原始收益率 ACF</text><text x="540" y="120" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#111827">平方/绝对收益 ACF</text><line x1="90" y1="405" x2="410" y2="405" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="90" y1="405" x2="90" y2="150" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="545" y1="405" x2="865" y2="405" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="545" y1="405" x2="545" y2="150" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/><line x1="115" y1="405" x2="115" y2="315" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="138" y1="405" x2="138" y2="395" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="161" y1="405" x2="161" y2="413" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="184" y1="405" x2="184" y2="399" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="207" y1="405" x2="207" y2="417" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="230" y1="405" x2="230" y2="397" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="253" y1="405" x2="253" y2="401" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="276" y1="405" x2="276" y2="411" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="299" y1="405" x2="299" y2="400" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="322" y1="405" x2="322" y2="409" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="345" y1="405" x2="345" y2="402" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="368" y1="405" x2="368" y2="408" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><line x1="570" y1="405" x2="570" y2="245" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><line x1="593" y1="405" x2="593" y2="275" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><line x1="616" y1="405" x2="616" y2="300" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><line x1="639" y1="405" x2="639" y2="317" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><line x1="662" y1="405" x2="662" y2="331" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><line x1="685" y1="405" x2="685" y2="345" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><line x1="708" y1="405" x2="708" y2="357" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><line x1="731" y1="405" x2="731" y2="367" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><line x1="754" y1="405" x2="754" y2="375" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><line x1="777" y1="405" x2="777" y2="381" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><line x1="800" y1="405" x2="800" y2="385" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><line x1="823" y1="405" x2="823" y2="389" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><text x="104" y="455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#4b5563">收益率本身常接近无自相关</text><text x="558" y="455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#4b5563">波动大小有持续性：大波动后更容易接大波动</text><text x="180" y="505" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#374151">读法：不是说收益方向很好预测，而是说风险强度会成簇出现。</text></svg>
