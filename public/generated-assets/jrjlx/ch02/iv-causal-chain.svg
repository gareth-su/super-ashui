<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0284c7"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/><text x="64" y="70" font-size="38" font-weight="800" fill="#0f172a">工具变量的核心链条</text><text x="64" y="112" font-size="22" fill="#475569">Z 只通过 X 影响 Y，不能直接钻进误差项 u。</text>
<rect x="80" y="170" width="340" height="135" rx="14" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/><text x="98" y="204" font-size="24" font-weight="700" fill="#0f172a">Z：工具变量</text>
<text x="98" y="238" font-size="20" fill="#334155">例：税收、降雨、距离</text>
<text x="98" y="265" font-size="20" fill="#334155">要求：和 X 有关</text>
<rect x="470" y="170" width="340" height="135" rx="14" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="488" y="204" font-size="24" font-weight="700" fill="#0f172a">X：内生解释变量</text>
<text x="488" y="238" font-size="20" fill="#334155">例：价格、班级规模</text>
<text x="488" y="265" font-size="20" fill="#334155">可能和 u 相关</text>
<rect x="860" y="170" width="340" height="135" rx="14" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="878" y="204" font-size="24" font-weight="700" fill="#0f172a">Y：结果变量</text>
<text x="878" y="238" font-size="20" fill="#334155">例：消费量、考试成绩</text>
<text x="878" y="265" font-size="20" fill="#334155">我们想解释它</text>
<rect x="470" y="430" width="340" height="135" rx="14" fill="#fee2e2" stroke="#94a3b8" stroke-width="2"/><text x="488" y="464" font-size="24" font-weight="700" fill="#0f172a">u：看不见的因素</text>
<text x="488" y="498" font-size="20" fill="#334155">偏好、能力、健康等</text>
<text x="488" y="525" font-size="20" fill="#334155">Z 不能与它相关</text>
<text x="64" y="684" font-size="18" fill="#64748b">教学示意图：用于理解操作链路，不是 Stata 回归结果截图。</text></svg>