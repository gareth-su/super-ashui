<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0284c7"/></marker></defs><rect width="1280" height="720" fill="#f8fafc"/><text x="64" y="70" font-size="38" font-weight="800" fill="#0f172a">供需图里的 IV 直觉</text><text x="64" y="112" font-size="22" fill="#475569">普通价格-数量点混合供给和需求；只利用供给移动带来的价格变化识别需求曲线。</text>
<rect x="90" y="200" width="430" height="135" rx="14" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/><text x="108" y="234" font-size="24" font-weight="700" fill="#0f172a">普通 OLS 点</text>
<text x="108" y="268" font-size="20" fill="#334155">供需共同决定价格和数量</text>
<text x="108" y="295" font-size="20" fill="#334155">不一定是需求弹性</text>
<rect x="760" y="200" width="390" height="135" rx="14" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="778" y="234" font-size="24" font-weight="700" fill="#0f172a">工具变量 Z</text>
<text x="778" y="268" font-size="20" fill="#334155">例：产奶区降雨</text>
<text x="778" y="295" font-size="20" fill="#334155">推动供给从而推动价格</text>
<rect x="330" y="450" width="600" height="135" rx="14" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="348" y="484" font-size="24" font-weight="700" fill="#0f172a">IV 抓住的变化</text>
<text x="348" y="518" font-size="20" fill="#334155">Z → 供给移动 → P 变化 → Q 变化</text>
<text x="348" y="545" font-size="20" fill="#334155">Z 不能直接改变需求偏好</text>
<text x="64" y="684" font-size="18" fill="#64748b">教学示意图：用于理解操作链路，不是 Stata 回归结果截图。</text></svg>