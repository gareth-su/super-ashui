<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fbfcff"/>
  <text x="60" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">断点回归：阈值附近像一个小实验</text>
  <text x="60" y="110" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5b6472">教学示意图：根据讲义内容重绘。横轴是分配变量 W，竖线是阈值 w0，处理概率或结果在阈值处发生跳跃。</text>
  <g transform="translate(110,145)" font-family="Microsoft YaHei, Arial, sans-serif">
    <line x1="0" y1="500" x2="940" y2="500" stroke="#172033" stroke-width="3"/>
    <line x1="0" y1="500" x2="0" y2="40" stroke="#172033" stroke-width="3"/>
    <line x1="470" y1="500" x2="470" y2="45" stroke="#d95f59" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="444" y="535" font-size="22" fill="#d95f59">w0</text>
    <text x="355" y="570" font-size="20" fill="#5b6472">未过阈值</text>
    <text x="535" y="570" font-size="20" fill="#5b6472">过阈值</text>
    <path d="M40 420 C160 380 300 330 455 292" fill="none" stroke="#7194d9" stroke-width="5"/>
    <path d="M485 205 C640 170 785 130 900 85" fill="none" stroke="#8e71d9" stroke-width="5"/>
    <circle cx="455" cy="292" r="8" fill="#7194d9"/>
    <circle cx="485" cy="205" r="8" fill="#8e71d9"/>
    <line x1="470" y1="292" x2="470" y2="205" stroke="#d95f59" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="500" y="255" font-size="22" font-weight="700" fill="#d95f59">断点跳跃</text>
    <text x="785" y="535" font-size="20" fill="#172033">分配变量 W</text>
    <text x="-40" y="30" font-size="20" fill="#172033">结果 Y</text>
    <rect x="690" y="330" width="255" height="95" rx="14" fill="#ffffff" stroke="#c9d2e3"/>
    <text x="715" y="365" font-size="18" font-weight="700" fill="#172033">锐利 RD</text>
    <text x="715" y="395" font-size="16" fill="#5b6472">阈值完全决定是否处理</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#d95f59"/>
    </marker>
  </defs>
</svg>
