<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f7f8fb"/>
  <text x="60" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">DID 的 2×2 均值算法</text>
  <text x="60" y="110" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5b6472">教学示意图：根据讲义内容重绘。DID 不是只看处理后差异，也不是只看处理组前后差异。</text>
  <g transform="translate(120,160)" font-family="Microsoft YaHei, Arial, sans-serif">
    <rect x="0" y="0" width="960" height="410" rx="18" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/>
    <line x1="0" y1="100" x2="960" y2="100" stroke="#c9d2e3" stroke-width="2"/>
    <line x1="250" y1="0" x2="250" y2="410" stroke="#c9d2e3" stroke-width="2"/>
    <line x1="600" y1="0" x2="600" y2="410" stroke="#c9d2e3" stroke-width="2"/>
    <line x1="0" y1="255" x2="960" y2="255" stroke="#c9d2e3" stroke-width="2"/>
    <text x="70" y="62" font-size="24" font-weight="700" fill="#172033">组别</text>
    <text x="360" y="62" font-size="24" font-weight="700" fill="#172033">处理前</text>
    <text x="720" y="62" font-size="24" font-weight="700" fill="#172033">处理后</text>
    <text x="52" y="180" font-size="24" font-weight="700" fill="#172033">对照组</text>
    <text x="52" y="335" font-size="24" font-weight="700" fill="#172033">处理组</text>
    <text x="345" y="180" font-size="23" fill="#172033">Y_C,pre</text>
    <text x="695" y="180" font-size="23" fill="#172033">Y_C,post</text>
    <text x="345" y="335" font-size="23" fill="#172033">Y_T,pre</text>
    <text x="695" y="335" font-size="23" fill="#172033">Y_T,post</text>
    <path d="M430 215 H760" stroke="#7194d9" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M430 370 H760" stroke="#8e71d9" stroke-width="4" marker-end="url(#arrowPurple)"/>
  </g>
  <rect x="180" y="610" width="840" height="55" rx="26" fill="#172033"/>
  <text x="230" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#ffffff">DID = (处理组后 - 处理组前) - (对照组后 - 对照组前)</text>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7194d9"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8e71d9"/>
    </marker>
  </defs>
</svg>
