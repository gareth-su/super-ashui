<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">自然实验案例的统一读法</text>
  <text x="60" y="110" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5b6472">教学示意图：根据讲义案例重绘。读自然实验时，先找外生冲击，再判断它如何改变 treatment。</text>
  <g font-family="Microsoft YaHei, Arial, sans-serif">
    <rect x="70" y="170" width="230" height="120" rx="16" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/>
    <text x="110" y="220" font-size="24" font-weight="700" fill="#172033">外生事件</text>
    <text x="100" y="254" font-size="17" fill="#5b6472">政策、阈值、距离、冲击</text>
    <rect x="375" y="170" width="230" height="120" rx="16" fill="#fff7e8" stroke="#e6b75f" stroke-width="2"/>
    <text x="415" y="220" font-size="24" font-weight="700" fill="#172033">处理变化</text>
    <text x="405" y="254" font-size="17" fill="#5b6472">谁更可能被影响</text>
    <rect x="680" y="170" width="230" height="120" rx="16" fill="#eaf7f1" stroke="#60b78a" stroke-width="2"/>
    <text x="720" y="220" font-size="24" font-weight="700" fill="#172033">结果变量</text>
    <text x="710" y="254" font-size="17" fill="#5b6472">工资、成绩、健康、就业</text>
    <rect x="890" y="395" width="230" height="120" rx="16" fill="#f1ecff" stroke="#9372d9" stroke-width="2"/>
    <text x="930" y="445" font-size="24" font-weight="700" fill="#172033">识别威胁</text>
    <text x="920" y="479" font-size="17" fill="#5b6472">还有没有其他通道？</text>
    <path d="M300 230 H375" stroke="#8b95a5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M605 230 H680" stroke="#8b95a5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M795 290 C840 350 900 375 1005 395" fill="none" stroke="#8b95a5" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="90" y="395" width="720" height="160" rx="18" fill="#ffffff" stroke="#c9d2e3" stroke-width="2"/>
    <text x="125" y="445" font-size="22" font-weight="700" fill="#172033">考试写法固定四问</text>
    <text x="125" y="485" font-size="19" fill="#5b6472">1. 研究问题是什么？ 2. treatment / control 是谁？</text>
    <text x="125" y="520" font-size="19" fill="#5b6472">3. 外生变化为什么近似随机？ 4. 最大威胁是什么？</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b95a5"/>
    </marker>
  </defs>
</svg>
