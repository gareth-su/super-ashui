<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><style>.bg{fill:#f5f7fb}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{fill:#e8eef7}.green{fill:#0f766e}.blue{fill:#1d4ed8}.orange{fill:#b45309}.title{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}.sub{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:25px;fill:#475569}.txt{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:24px;fill:#1f2937}.small{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:21px;fill:#475569}.mono{font-family:Consolas,'Courier New',monospace;font-size:22px;fill:#111827}.white{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:22px;font-weight:700;fill:white}.line{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#a)}.gline{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#ga)}.bline{stroke:#1d4ed8;stroke-width:5;fill:none;marker-end:url(#ba)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker></defs><rect class="bg" width="1600" height="1000"/><text x="70" y="75" class="title">命令输在哪里，输出看哪里</text><text x="70" y="118" class="sub">Command/Do-file Editor 是输入入口，Results/log 是证据入口</text><rect x="110" y="190" width="520" height="220" rx="18" class="card"/><text x="145" y="250" class="title">1. 输入命令</text><text x="145" y="315" class="mono">. xtset state year</text><text x="145" y="365" class="txt">短命令在 Command，长脚本在 Do-file Editor。</text><rect x="970" y="190" width="520" height="220" rx="18" class="card"/><text x="1005" y="250" class="title">2. 看输出</text><text x="1005" y="315" class="mono">panel variable: state</text><text x="1005" y="355" class="mono">time variable: year</text><path d="M640,300 C760,300 830,300 960,300" class="gline"/><rect x="110" y="560" width="1380" height="260" rx="18" class="card"/><text x="145" y="620" class="title">读输出顺序</text><text x="145" y="690" class="txt">先看命令是否成功，再看样本量和组数，最后看系数、标准误、t/z、p 值。</text></svg>