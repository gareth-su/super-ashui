<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><style>.bg{fill:#f5f7fb}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{fill:#e8eef7}.green{fill:#0f766e}.blue{fill:#1d4ed8}.orange{fill:#b45309}.title{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}.sub{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:25px;fill:#475569}.txt{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:24px;fill:#1f2937}.small{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:21px;fill:#475569}.mono{font-family:Consolas,'Courier New',monospace;font-size:22px;fill:#111827}.white{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:22px;font-weight:700;fill:white}.line{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#a)}.gline{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#ga)}.bline{stroke:#1d4ed8;stroke-width:5;fill:none;marker-end:url(#ba)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker></defs><rect class="bg" width="1600" height="1000"/><text x="70" y="75" class="title">xtset 概念图</text><text x="70" y="118" class="sub">xtset 是命令，不是文件名；它声明“谁是个体，谁是时间”</text><rect x="120" y="220" width="380" height="180" rx="18" class="card"/><text x="160" y="285" class="title">数据中已有变量</text><text x="160" y="340" class="mono">state   year</text><rect x="610" y="220" width="380" height="180" rx="18" fill="#eef2ff" stroke="#1d4ed8" stroke-width="3"/><text x="650" y="285" class="title">执行命令</text><text x="650" y="340" class="mono">xtset state year</text><rect x="1100" y="220" width="380" height="180" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/><text x="1140" y="285" class="title">Stata 理解为</text><text x="1140" y="340" class="txt">州 × 年份面板</text><path d="M500,310 L600,310" class="bline"/><path d="M990,310 L1090,310" class="gline"/><text x="180" y="590" class="txt">如果不 xtset，Stata 不知道哪些行属于同一个州，也不知道时间顺序。</text></svg>