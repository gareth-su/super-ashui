<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><style>.bg{fill:#f5f7fb}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{fill:#e8eef7}.green{fill:#0f766e}.blue{fill:#1d4ed8}.orange{fill:#b45309}.title{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}.sub{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:25px;fill:#475569}.txt{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:24px;fill:#1f2937}.small{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:21px;fill:#475569}.mono{font-family:Consolas,'Courier New',monospace;font-size:22px;fill:#111827}.white{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:22px;font-weight:700;fill:white}.line{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#a)}.gline{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#ga)}.bline{stroke:#1d4ed8;stroke-width:5;fill:none;marker-end:url(#ba)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker></defs><rect class="bg" width="1600" height="1000"/><text x="70" y="75" class="title">TABLE 10.1 列映射图</text><text x="70" y="118" class="sub">每一列都来自一条命令和一段 log 输出</text><rect x="80" y="180" width="360" height="160" rx="18" class="card"/><text x="115" y="240" class="title">Stata 命令</text><text x="115" y="295" class="mono">xtreg ..., fe vce(cluster state)</text><rect x="540" y="180" width="360" height="160" rx="18" class="card"/><text x="575" y="240" class="title">log 输出</text><text x="575" y="295" class="mono">Coef. / Std. Err. / P>|t|</text><rect x="1000" y="180" width="3