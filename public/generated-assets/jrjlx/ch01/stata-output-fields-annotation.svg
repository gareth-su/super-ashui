<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><style>.bg{fill:#f5f7fb}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{fill:#e8eef7}.green{fill:#0f766e}.blue{fill:#1d4ed8}.orange{fill:#b45309}.title{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}.sub{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:25px;fill:#475569}.txt{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:24px;fill:#1f2937}.small{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:21px;fill:#475569}.mono{font-family:Consolas,'Courier New',monospace;font-size:22px;fill:#111827}.white{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:22px;font-weight:700;fill:white}.line{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#a)}.gline{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#ga)}.bline{stroke:#1d4ed8;stroke-width:5;fill:none;marker-end:url(#ba)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker></defs><rect class="bg" width="1600" height="1000"/><text x="70" y="75" class="title">关键输出字段注释图</text><text x="70" y="118" class="sub">读回归输出时，按字段而不是按感觉读</text><rect x="110" y="190" width="1380" height="620" rx="18" class="card"/><text x="150" y="255" class="mono">vfrall        Coef.     Std. Err.      t      P&gt;|t|</text><rect x="150" y="285" width="950" height="65" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/><text x="175" y="327" class="mono">beertax    -.6558736    .2918556   -2.25    0.029</text><text x="160" y="450" class="txt">Coef.：方向和大小，解释经济含义</text><text x="160" y="500" class="txt">Std. Err.：不确定性，cluster 后通常会变</text><text x="160" y="550" class="txt">t / z：检验统计量</text><text x="160" y="600" class="txt">P>|t| 或 P>|z|：显著性，不是“正确概率”</text><text x="160" y="650" class="txt">Number of obs / groups / R-sq / rho：样本结构和模型信息</text></svg>