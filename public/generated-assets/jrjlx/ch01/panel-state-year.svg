<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><style>.bg{fill:#f5f7fb}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{fill:#e8eef7}.green{fill:#0f766e}.blue{fill:#1d4ed8}.orange{fill:#b45309}.title{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}.sub{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:25px;fill:#475569}.txt{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:24px;fill:#1f2937}.small{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:21px;fill:#475569}.mono{font-family:Consolas,'Courier New',monospace;font-size:22px;fill:#111827}.white{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:22px;font-weight:700;fill:white}.line{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#a)}.gline{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#ga)}.bline{stroke:#1d4ed8;stroke-width:5;fill:none;marker-end:url(#ba)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker></defs><rect class="bg" width="1600" height="1000"/><text x="70" y="75" class="title">state / year 面板结构示意图</text><text x="70" y="118" class="sub">一行不是“一个州”，而是“一个州在某一年”的观测</text><rect x="180" y="190" width="1240" height="620" rx="18" class="card"/><text x="230" y="255" class="title">fatality.dta 的面板结构：48 个州 × 7 年</text><rect x="260" y="330" width="1080" height="70" class="head"/><text x="300" y="375" class="mono">state</text><text x="520" y="375" class="mono">year</text><text x="760" y="375" class="mono">vfrall</text><text x="1030" y="375" class="mono">beertax</text><rect x="260" y="400" width="1080" height="70" fill="#f8fafc" stroke="#e2e8f0"/><text x="300" y="445" class="mono">1</text><text x="520" y="445" class="mono">1982</text><text x="760" y="445" class="mono">...</text><text x="1030" y="445" class="mono">...</text><rect x="260" y="470" width="1080" height="70" fill="#fff" stroke="#e2e8f0"/><text x="300" y="515" class="mono">1</text><text x="520" y="515" class="mono">1983</text><text x="760" y="515" class="mono">...</text><text x="1030" y="515" class="mono">...</text><rect x="260" y="540" width="1080" height="70" fill="#f8fafc" stroke="#e2e8f0"/><text x="300" y="585" class="mono">1</text><text x="520" y="585" class="mono">1984</text><text x="760" y="585" class="mono">...</text><text x="1030" y="585" class="mono">...</text><rect x="260" y="610" width="1080" height="70" fill="#fff" stroke="#e2e8f0"/><text x="300" y="655" class="mono">1</text><text x="520" y="655" class="mono">1985</text><text x="760" y="655" class="mono">...</text><text x="1030" y="655" class="mono">...</text><rect x="260" y="680" width="1080" height="70" fill="#f8fafc" stroke="#e2e8f0"/><text x="300" y="725" class="mono">1</text><text x="520" y="725" class="mono">1986</text><text x="760" y="725" class="mono">...</text><text x="1030" y="725" class="mono">...</text><text x="300" y="760" class="txt">同一个 state 会出现多次；每次对应不同 year。这就是面板数据。</text></svg>