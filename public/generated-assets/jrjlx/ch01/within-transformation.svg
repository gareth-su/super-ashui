<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><style>.bg{fill:#f5f7fb}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{fill:#e8eef7}.green{fill:#0f766e}.blue{fill:#1d4ed8}.orange{fill:#b45309}.title{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}.sub{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:25px;fill:#475569}.txt{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:24px;fill:#1f2937}.small{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:21px;fill:#475569}.mono{font-family:Consolas,'Courier New',monospace;font-size:22px;fill:#111827}.white{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:22px;font-weight:700;fill:white}.line{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#a)}.gline{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#ga)}.bline{stroke:#1d4ed8;stroke-width:5;fill:none;marker-end:url(#ba)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker></defs><rect class="bg" width="1600" height="1000"/><text x="70" y="75" class="title">fixed effect / within 变换直觉图</text><text x="70" y="118" class="sub">同一个州和自己的平均水平比，时间不变差异就被扣掉</text><rect x="90" y="210" width="420" height="360" rx="18" class="card"/><text x="130" y="270" class="title">原始比较</text><text x="130" y="335" class="txt">州 A 和州 B 本来就不同。</text><text x="130" y="380" class="txt">横向比较会混入道路、执法、文化差异。</text><rect x="590" y="210" width="420" height="360" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/><text x="630" y="270" class="title">within 变换</text><text x="630" y="335" class="txt">每个州减去自己的平均值。</text><text x="630" y="380" class="txt">同一个州和自己比。</text><rect x="1090" y="210" width="420" height="360" rx="18" class="card"/><text x="1130" y="270" class="title">固定效应 FE</text><text x="1130" y="335" class="txt">时间不变的 α_i 被吸收。</text><text x="1130" y="380" class="txt">时间不变变量也无法估计。</text><path d="M510,390 L580,390" class="gline"/><path d="M1010,390 L1080,390" class="gline"/><text x="380" y="760" class="mono">Y_it - mean(Y_i) = beta [X_it - mean(X_i)] + error</text></svg>