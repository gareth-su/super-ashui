<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><style>.bg{fill:#f5f7fb}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{fill:#e8eef7}.green{fill:#0f766e}.blue{fill:#1d4ed8}.orange{fill:#b45309}.title{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}.sub{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:25px;fill:#475569}.txt{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:24px;fill:#1f2937}.small{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:21px;fill:#475569}.mono{font-family:Consolas,'Courier New',monospace;font-size:22px;fill:#111827}.white{font-family:'Microsoft YaHei',Arial,sans-serif;font-size:22px;font-weight:700;fill:white}.line{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#a)}.gline{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#ga)}.bline{stroke:#1d4ed8;stroke-width:5;fill:none;marker-end:url(#ba)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker></defs><rect class="bg" width="1600" height="1000"/><text x="70" y="75" class="title">FE vs RE vs FD vs Between 对比图</text><text x="70" y="118" class="sub">模型差别不是名字，而是使用了哪类变化信息</text><rect x="90" y="210" width="320" height="500" rx="18" class="card"/><text x="130" y="270" class="title">Between</text><text x="130" y="335" class="txt">比较不同个体均值。</text><text x="130" y="380" class="txt">容易混入长期差异。</text><rect x="455" y="210" width="320" height="500" rx="18" class="card"/><text x="495" y="270" class="title">FD</text><text x="495" y="335" class="txt">比较前后变化。</text><text x="495" y="380" class="txt">可消去时间不变因素。</text><rect x="820" y="210" width="320" height="500" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/><text x="860" y="270" class="title">FE / within</text><text x="860" y="335" class="txt">比较同一个体相对自身均值。</text><rect x="1185" y="210" width="320" height="500" rx="18" class="card"/><text x="1225" y="270" class="title">RE</text><text x="1225" y="335" class="txt">同时用组内和组间。</text><text x="1225" y="380" class="txt">要求 α_i 与 X 不相关。</text></svg>